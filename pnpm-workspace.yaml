catalogMode: strict

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types"
  - miniflare
  - wrangler
  - typescript@6.0.2
  # Vite 8 validated in this workspace via grouped dependency integration branch
  - vite@8.0.9
  # Renovate security update: hono@4.12.12 || 4.12.14 || 4.12.18
  - hono@4.12.12 || 4.12.14 || 4.12.18
  # Renovate security update: astro@6.1.6 || 6.4.6
  - astro@6.1.6 || 6.4.6

overrides:
  brace-expansion: "catalog:"
  devalue: ">=5.9.4"
  deepmerge-ts: ^8.0.2
  fast-uri: ">=4.0.0"
  fast-xml-parser: "catalog:"
  h3: "catalog:"
  handlebars: "catalog:"
  minimatch: "catalog:"
  picomatch: "catalog:"
  svgo: "catalog:"
  vite: "catalog:"
  sharp: ">=0.35.5"
  ws: ">=8.20.1"
  yaml: "catalog:"
