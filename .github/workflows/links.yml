name: Check Markdown links

# Explicit least-privilege permissions for link checking
permissions:
  contents: read
  issues: write # Required to create issues for broken links (if configured)

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 18 * * *"

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Restore lychee cache
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Link Checker
        uses: lycheeverse/lychee-action@f81112d0d2814ded911bd23e3beaa9dda9093915 # v2
        with:
          args: >
            --cache
            --max-cache-age 1d
            --max-redirects 10
            --max-retries 5
            --timeout 10
            --user-agent "Mozilla/5.0 (compatible; LinkChecker/1.0)"
            --base-url https://yunielacosta.com
            --exclude-path ./node_modules
            --exclude-path ./dist
            --exclude-path ./.astro
            --exclude-loopback
            --exclude-all-private
            .
          fail: true

      - name: Save lychee cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: always()
        with:
          path: .lycheecache
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}

      - name: Create Issue
        if: env.lychee_exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: 🔗 Broken Links Detected - ${{ github.run_number }}
          content-filepath: ./lychee/out.md
          labels: |
            bug
            automated
            links
