name: Deploy Portfolio

on:
  push:
    branches: [main]
    paths:
      - "apps/portfolio/**"
      - ".github/workflows/deploy-portfolio.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - production
          - preview
        default: "production"

concurrency:
  group: deploy-portfolio-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: 🏗️ Build Portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: ${{ inputs.environment || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup monorepo
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build portfolio
        uses: ./.github/actions/build-portfolio
        with:
          skip-check: "false"
          upload-artifact: "true"

      - name: Upload build for deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-build-${{ github.sha }}
          path: apps/portfolio/dist/
          retention-days: 1

  deploy-cloudflare:
    name: 🚀 Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portfolio-build-${{ github.sha }}
          path: apps/portfolio/dist/

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/portfolio/dist --project-name=yap-portfolio --branch=${{ github.ref_name }}

      - name: Deployment summary
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Deployment Complete

          - **Environment**: ${{ inputs.environment || 'production' }}
          - **URL**: ${{ steps.deploy.outputs.url }}
          - **Commit**: `${{ github.sha }}`
          - **Branch**: `${{ github.ref_name }}`
          EOF

  post-deploy:
    name: 📊 Post-Deployment
    runs-on: ubuntu-latest
    needs: [deploy-cloudflare]
    if: always() && needs.deploy-cloudflare.result == 'success'
    timeout-minutes: 5
    steps:
      - name: Notify deployment
        run: |
          echo "✅ Portfolio deployed successfully!"
          echo "Check it out at: ${{ needs.deploy-cloudflare.outputs.url }}"
      # Add post-deployment tasks here:
      # - Lighthouse CI
      # - Cache warming
      # - Notify team
      # - Update status page
